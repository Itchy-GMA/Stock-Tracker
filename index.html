<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株価トラッカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --border: #e8e8e4;
    --text: #1a1a18;
    --muted: #888880;
    --up: #1a6b35;
    --up-bg: #e8f5ed;
    --down: #c0392b;
    --down-bg: #fdf0ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .top-bar { background: #1a1a18; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .top-bar h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.05em; }
  .top-bar .meta { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  .updated { font-size: 11px; color: rgba(255,255,255,0.55); }
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
  .stats-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1.25rem; min-width: 100px; }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-value.up { color: var(--up); }
  .stat-value.down { color: var(--down); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  thead { background: #f9f9f7; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.r { text-align: right; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafaf8; cursor: pointer; }
  .td-code { font-family: monospace; font-size: 12px; color: var(--muted); }
  .td-name { font-weight: 500; }
  .td-price { text-align: right; font-family: monospace; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .td-change { text-align: right; white-space: nowrap; }
  .td-spark { width: 130px; }
  .td-date { text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
  .badge-up { background: var(--up-bg); color: var(--up); }
  .badge-down { background: var(--down-bg); color: var(--down); }
  .badge-flat { background: #f0f0ee; color: var(--muted); }
  .spark { width: 130px; height: 36px; display: block; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 1.75rem; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-code { font-size: 12px; color: var(--muted); font-family: monospace; margin-top: 3px; }
  .close-btn { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; }
  .chart-wrap { height: 180px; margin-bottom: 1.25rem; }
  .hist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hist-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 0 8px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .hist-table th.r { text-align: right; }
  .hist-table td { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .hist-table td.r { text-align: right; }
  .hist-table tr:last-child td { border-bottom: none; }
  .modal-footer { margin-top: 1.25rem; display: flex; justify-content: flex-end; }
  .btn { padding: 7px 18px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
  .btn:hover { background: var(--bg); }
</style>
</head>
<body>
<div class="top-bar">
  <div>
    <h1>株価トラッカー</h1>
    <div class="meta">自動更新: 毎週土曜 13:00 JST &nbsp;|&nbsp; stooq.com</div>
  </div>
  <span class="updated" id="last-updated">読み込み中...</span>
</div>

<div class="container">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>コード</th>
          <th>企業名</th>
          <th class="r">株価（円）</th>
          <th class="r">前週比</th>
          <th>推移（12週）</th>
          <th class="r">更新日</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="m-name"></div>
        <div class="modal-code" id="m-code"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="chart-wrap"><canvas id="m-chart"></canvas></div>
    <table class="hist-table">
      <thead><tr><th>日付</th><th class="r">終値</th><th class="r">前週比</th></tr></thead>
      <tbody id="m-tbody"></tbody>
    </table>
    <div class="modal-footer"><button class="btn" onclick="closeModal()">閉じる</button></div>
  </div>
</div>

<script>
let data = { stocks: [], history: {}, lastUpdated: null };
let chart = null;

async function load() {
  try {
    const r = await fetch('./results.json?_=' + Date.now());
    if (r.ok) data = await r.json();
    document.getElementById('last-updated').textContent =
      data.lastUpdated ? '最終取得: ' + data.lastUpdated.slice(0,10).replace(/-/g,'/') : '未取得';
  } catch(e) {
    document.getElementById('last-updated').textContent = '読み込み失敗';
  }
  renderStats();
  renderTable();
}

function renderStats() {
  const stocks = data.stocks.filter(s => s.latestPrice != null);
  let up = 0, dn = 0, fl = 0;
  stocks.forEach(s => {
    const h = data.history[s.code] || [];
    if (h.length < 2) { fl++; return; }
    const d = h[h.length-1].price - h[h.length-2].price;
    if (d > 0) up++; else if (d < 0) dn++; else fl++;
  });
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-label">銘柄数</div><div class="stat-value">${data.stocks.length}</div></div>
    <div class="stat"><div class="stat-label">値上がり</div><div class="stat-value up">▲ ${up}</div></div>
    <div class="stat"><div class="stat-label">値下がり</div><div class="stat-value down">▼ ${dn}</div></div>
    <div class="stat"><div class="stat-label">変わらず</div><div class="stat-value">${fl}</div></div>
  `;
}

function sparkSVG(prices, isUp) {
  if (!prices || prices.length < 2) return `<svg class="spark" viewBox="0 0 130 36"><line x1="0" y1="18" x2="130" y2="18" stroke="#ddd" stroke-width="1"/></svg>`;
  const w=130, h=36, p=3;
  const min=Math.min(...prices), max=Math.max(...prices), rng=max-min||1;
  const pts = prices.map((v,i) => {
    const x = p + i/(prices.length-1)*(w-p*2);
    const y = h-p-(v-min)/rng*(h-p*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const col = isUp ? '#1a6b35' : '#c0392b';
  const fill = isUp ? 'rgba(26,107,53,0.08)' : 'rgba(192,57,43,0.08)';
  const lp = pts[pts.length-1].split(',');
  const fp = `M${pts[0]} L${pts.join(' L')} L${lp[0]},${h} L${p},${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${fp}" fill="${fill}"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  if (!data.stocks.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--muted)">データなし</td></tr>';
    return;
  }
  tbody.innerHTML = data.stocks.map(s => {
    const hist = (data.history[s.code]||[]).slice(-12);
    const price = s.latestPrice;
    const prev = hist.length>=2 ? hist[hist.length-2].price : null;
    const diff = price!=null && prev!=null ? price-prev : null;
    const pct = diff!=null ? (diff/prev*100) : null;
    const isUp = diff!=null ? diff>=0 : true;
    const sign = diff!=null && diff>=0 ? '+' : '';
    const cls = diff==null ? 'badge-flat' : isUp ? 'badge-up' : 'badge-down';
    const badge = diff==null ? '---' : `${sign}${diff.toFixed(0)}円 (${sign}${pct.toFixed(2)}%)`;
    const priceText = price!=null ? '¥'+price.toLocaleString('ja-JP') : '---';
    return `<tr onclick="showModal('${s.code}')">
      <td class="td-code">${s.code}</td>
      <td class="td-name">${s.name}</td>
      <td class="td-price">${priceText}</td>
      <td class="td-change"><span class="badge ${cls}">${badge}</span></td>
      <td class="td-spark">${sparkSVG(hist.map(h=>h.price), isUp)}</td>
      <td class="td-date">${s.latestDate?s.latestDate.replace(/-/g,'/'):'---'}</td>
    </tr>`;
  }).join('');
}

function showModal(code) {
  const s = data.stocks.find(s=>s.code===code);
  const hist = [...(data.history[code]||[])].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('m-name').textContent = s?.name||code;
  document.getElementById('m-code').textContent = code;
  const labels = [...hist].reverse().map(h=>h.date.slice(5).replace('-','/'));
  const prices = [...hist].reverse().map(h=>h.price);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('m-chart'), {
    type: 'line',
    data: { labels, datasets: [{ data: prices, borderColor:'#1a6b35', backgroundColor:'rgba(26,107,53,0.06)', fill:true, tension:0.3, pointRadius:3, pointBackgroundColor:'#1a6b35' }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales: {
        x:{ticks:{color:'#888',font:{size:10},maxRotation:45,autoSkip:true}},
        y:{ticks:{color:'#888',font:{size:10},callback:v=>'¥'+v.toLocaleString()}}
      }
    }
  });
  document.getElementById('m-tbody').innerHTML = hist.length===0
    ? '<tr><td colspan="3" style="color:var(--muted);padding:12px 0">データなし</td></tr>'
    : hist.map((h,i)=>{
        const prev=hist[i+1];
        const diff=prev?h.price-prev.price:null;
        const pct=diff!=null?(diff/prev.price*100):null;
        const sign=diff!=null&&diff>=0?'+':'';
        const cls=diff==null?'badge-flat':diff>=0?'badge-up':'badge-down';
        const badge=diff==null?'---':`${sign}${diff.toFixed(0)} (${sign}${pct.toFixed(2)}%)`;
        return `<tr>
          <td>${h.date.replace(/-/g,'/')}</td>
          <td class="r" style="font-family:monospace">¥${h.price.toLocaleString('ja-JP')}</td>
          <td class="r"><span class="badge ${cls}" style="font-size:11px">${badge}</span></td>
        </tr>`;
      }).join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (!e||e.target.id==='modal') document.getElementById('modal').classList.remove('open');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
load();
</script>
</body>
</html>
